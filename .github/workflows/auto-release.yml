name: auto-release
on:
  workflow_run:
    workflows: [ci]
    branches: [master, main]
    types: [completed]
concurrency:
  group: auto-release-default-branch
  cancel-in-progress: false
permissions:
  actions: write
  contents: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  cut-release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Tag the validated default-branch commit
        id: version
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch origin "$DEFAULT_BRANCH" --tags
          if [ "$(git rev-parse "origin/$DEFAULT_BRANCH")" != "$VALIDATED_SHA" ]; then
            echo "Default branch advanced; its own successful CI will release it."
            exit 0
          fi
          existing=$(git tag --points-at "$VALIDATED_SHA" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -n "$existing" ]; then
            echo "tag=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -z "$latest" ]; then
            next=v0.1.0
          else
            prefix=${latest%.*}
            patch=${latest##*.}
            next="$prefix.$((patch + 1))"
          fi
          git tag "$next" "$VALIDATED_SHA"
          git push origin "$next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
      - name: Publish release (including retries)
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run release.yml --ref "$DEFAULT_BRANCH" -f tag="$RELEASE_TAG"
