name: ci
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: flox/install-flox-action@5bb9eaaffbeaa699a8251a1ae21ecf4c8e0e37d4
      - name: Install frozen dependencies
        run: flox activate -- bun install --frozen-lockfile
      - name: Shared checks
        run: flox activate -- bun run check
      - name: Production build
        run: flox activate -- bun run build
      - name: Install browser
        run: flox activate -- bunx playwright install --with-deps chromium
      - name: Browser journeys and accessibility
        run: flox activate -- bun run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: browser-results
          path: test-results/
          retention-days: 7
