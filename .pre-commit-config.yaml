repos:
  - repo: local
    hooks:
      - id: shared-checks
        name: formatting, lint, types, docs, Mermaid, and LOC
        entry: bun run check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: production-checks
        name: production build and browser tests
        entry: bun run verify
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
